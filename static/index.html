<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free-Dooms Agent</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f0f; color: #e8e8e8; height: 100vh; display: flex; }
  
  .sidebar { width: 280px; background: #1a1a1a; border-right: 1px solid #2a2a2a; display: flex; flex-direction: column; padding: 16px; }
  .sidebar h1 { font-size: 18px; margin-bottom: 4px; }
  .sidebar .sub { color: #888; font-size: 12px; margin-bottom: 20px; }
  .key-section { background: #242424; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  .key-section label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: .5px; }
  .key-display { background: #1a1a1a; border-radius: 4px; padding: 8px; font-family: monospace; font-size: 12px; word-break: break-all; margin: 6px 0; color: #4ade80; display: none; }
  .key-section .actions { display: flex; gap: 6px; }
  .btn { padding: 6px 14px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; transition: .2s; }
  .btn-primary { background: #4ade80; color: #000; }
  .btn-primary:hover { background: #22c55e; }
  .btn-secondary { background: #333; color: #e8e8e8; }
  .btn-secondary:hover { background: #444; }
  .btn-small { padding: 4px 10px; font-size: 11px; }
  .btn-copy { background: #333; color: #ccc; display: none; }
  .btn-copy:hover { background: #444; }
  
  .stats { font-size: 11px; color: #666; margin-top: auto; text-align: center; padding-top: 16px; }
  .stats a { color: #4ade80; text-decoration: none; }

  .main { flex: 1; display: flex; flex-direction: column; max-width: calc(100vw - 280px); }
  .chat-header { padding: 16px 24px; border-bottom: 1px solid #2a2a2a; font-size: 14px; color: #888; }
  .messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .msg { max-width: 720px; padding: 12px 16px; border-radius: 10px; line-height: 1.5; font-size: 14px; white-space: pre-wrap; }
  .msg.user { background: #2a2a2a; align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg.assistant { background: #1a1a1a; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #2a2a2a; }
  .msg.system { background: #1a2a1a; align-self: center; font-size: 12px; color: #888; border: 1px solid #2a3a2a; }
  .msg .label { font-size: 11px; color: #666; margin-bottom: 4px; }

  .input-area { padding: 16px 24px; border-top: 1px solid #2a2a2a; }
  .input-row { display: flex; gap: 8px; max-width: 720px; }
  textarea { flex: 1; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 10px 14px; color: #e8e8e8; font-size: 14px; resize: none; outline: none; font-family: inherit; }
  textarea:focus { border-color: #4ade80; }
  .send-btn { background: #4ade80; color: #000; border: none; border-radius: 8px; width: 44px; cursor: pointer; font-size: 18px; transition: .2s; }
  .send-btn:hover { background: #22c55e; }
  .send-btn:disabled { background: #333; color: #666; cursor: not-allowed; }

  .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #444; gap: 8px; }
  .empty-state .logo { font-size: 48px; }
  .empty-state h2 { font-size: 20px; color: #666; }
  .empty-state p { font-size: 13px; }

  @media (max-width: 768px) {
    .sidebar { width: 100%; max-height: 200px; border-right: none; border-bottom: 1px solid #2a2a2a; }
    .main { max-width: 100vw; }
    body { flex-direction: column; }
  }
</style>
</head>
<body>

<div class="sidebar">
  <h1>🌪️ Free-Dooms</h1>
  <div class="sub">Free. Powerful. Zero tokens.</div>
  
  <div class="key-section">
    <label>API Key</label>
    <div id="keyDisplay" class="key-display"></div>
    <div class="actions">
      <button class="btn btn-primary btn-small" onclick="generateKey()">Generate Key</button>
      <button id="copyBtn" class="btn btn-secondary btn-small btn-copy" onclick="copyKey()">Copy</button>
    </div>
  </div>

  <div class="stats">
    <a href="https://github.com/dacdoyx/Free-Dooms_Agent" target="_blank">GitHub</a>
    &middot; Powered by Gemini 2.5 Flash
  </div>
</div>

<div class="main">
  <div class="chat-header">💬 Free-Dooms Chat</div>
  
  <div id="messages" class="messages">
    <div class="empty-state" id="emptyState">
      <div class="logo">🌀</div>
      <h2>Free-Dooms Agent</h2>
      <p>Generate an API key and start chatting for free.</p>
    </div>
  </div>

  <div class="input-area">
    <div class="input-row">
      <textarea id="input" rows="2" placeholder="Type a message..." onkeydown="handleKey(event)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>➤</button>
    </div>
  </div>
</div>

<script>
let API_KEY = localStorage.getItem('freeDoomsKey') || '';

const keyDisplay = document.getElementById('keyDisplay');
const copyBtn = document.getElementById('copyBtn');
const messagesEl = document.getElementById('messages');
const emptyState = document.getElementById('emptyState');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');

if (API_KEY) {
  keyDisplay.textContent = API_KEY;
  keyDisplay.style.display = 'block';
  copyBtn.style.display = 'inline-block';
  sendBtn.disabled = false;
}

const API_BASE = window.location.origin;

async function generateKey() {
  try {
    const res = await fetch(`${API_BASE}/v1/api-keys/generate`, { method: 'POST' });
    const data = await res.json();
    API_KEY = data.id;
    localStorage.setItem('freeDoomsKey', API_KEY);
    keyDisplay.textContent = API_KEY;
    keyDisplay.style.display = 'block';
    copyBtn.style.display = 'inline-block';
    sendBtn.disabled = false;
    addMessage('system', '🔑 New API key generated! Start chatting.');
  } catch (e) {
    addMessage('system', '❌ Failed to generate key. Is the server running?');
  }
}

function copyKey() {
  navigator.clipboard.writeText(API_KEY);
  copyBtn.textContent = 'Copied!';
  setTimeout(() => copyBtn.textContent = 'Copy', 1500);
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text || !API_KEY) return;

  addMessage('user', text);
  input.value = '';
  input.style.height = 'auto';
  sendBtn.disabled = true;

  const msgs = [...document.querySelectorAll('.msg.user, .msg.assistant')].map(el => ({
    role: el.dataset.role,
    content: el.dataset.content
  }));

  try {
    const res = await fetch(`${API_BASE}/v1/chat/completions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${API_KEY}` },
      body: JSON.stringify({ messages: msgs })
    });
    const data = await res.json();
    if (data.choices) {
      addMessage('assistant', data.choices[0].message.content);
    } else {
      addMessage('system', '❌ Error: ' + (data.detail?.error || 'Unknown'));
    }
  } catch (e) {
    addMessage('system', '❌ Network error. Check your connection.');
  }
  sendBtn.disabled = false;
}

function addMessage(role, content) {
  emptyState?.remove();
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.dataset.role = role;
  div.dataset.content = content;
  
  if (role === 'system') {
    div.textContent = content;
  } else {
    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = role === 'user' ? 'You' : 'Free-Dooms';
    div.appendChild(label);
    div.appendChild(document.createTextNode(content));
  }
  
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 150) + 'px';
});
</script>
</body>
</html>
